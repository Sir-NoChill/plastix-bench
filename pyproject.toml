[project]
name = "plastix-bench"
version = "0.1.0"
description = "Cross-framework benchmark suite for the Plastix sparse-network library."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
    # PyTorch reference implementations + dataset loaders.
    "torch>=2.2",
    "torchvision>=0.17",   # 06_ccwc_ncp: (permuted) sequential MNIST
    "tonic>=1.4",          # 08_snn_shd: Spiking Heidelberg Digits download
    "h5py>=3.10",          # 08_snn_shd: read the SHD HDF5 directly
    "snntorch>=0.9",       # 08_snn_shd: surrogate-gradient SNN
    "ncps>=1.0",           # 06_ccwc_ncp: Neural Circuit Policies baseline
    "reservoirpy>=0.3",    # 07_esn_mackey_class: echo-state network baseline
]

# The 09 audio-prediction dataset is generated by its own sub-project under
# 09_imprintin_learner/cpp/examples/ (pretty-midi / pyfluidsynth / soundfile +
# a system FluidSynth). setup.py's `audio` stage shells into that project, so
# those deps are not declared here. See README "Setup".

# The suite is driven by orchestrator.py / setup.py; there is no importable
# package.
[tool.setuptools]
py-modules = []
