[build-system]
requires = ["setuptools>=64", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-prediction-benchmark"
version = "0.1.0"
description = "Audio prediction benchmark from Khurram Javed's thesis (Section 9.3)"
requires-python = ">=3.8"
dependencies = [
    "pretty-midi",
    "pyfluidsynth",
    "numpy",
    "scipy",
    "soundfile",
    "matplotlib",
]

[project.scripts]
apb-generate = "audio_prediction_benchmark.generate:main"
apb-visualize = "audio_prediction_benchmark.visualize:main"

[tool.setuptools.packages.find]
where = ["src"]
