[project]
name = "plastix-bench"
version = "0.1.0"
description = "Cross-framework benchmark suite for the Plastix sparse-network library."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "scipy>=1.11",
    "torch>=2.2",
]

# The suite is driven by orchestrator.py; there is no importable package.
[tool.setuptools]
py-modules = []
