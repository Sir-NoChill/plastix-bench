[project]
name = "plastix-bench"
version = "0.1.0"
description = "Cross-framework benchmark suite for the Plastix sparse-network library."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
    # PyTorch reference implementations + dataset loaders.
    "torch>=2.2",
    "torchvision>=0.17",   # 06_ccwc_ncp: (permuted) sequential MNIST
    "tonic>=1.4",          # 08_snn_shd: Spiking Heidelberg Digits download
    "h5py>=3.10",          # 08_snn_shd: read the SHD HDF5 directly
    "snntorch>=0.9",       # 08_snn_shd: surrogate-gradient SNN
    "ncps>=1.0",           # 06_ccwc_ncp: Neural Circuit Policies baseline
    "reservoirpy>=0.3",    # 07_esn_mackey_class: echo-state network baseline
    "jax[cuda12]>=0.6.2",
    "optax>=0.2.8",
    "norse>=1.1.0",
]

# The 09 audio-prediction dataset is generated by its own sub-project under
# 09_imprintin_learner/cpp/examples/ (pretty-midi / pyfluidsynth / soundfile +
# a system FluidSynth). setup.py's `audio` stage shells into that project, so
# those deps are not declared here. See README "Setup".

# Optional extras — heavy / niche frameworks kept out of the default env. Install
# on demand, e.g. `uv sync --extra jax`. These back the JAX scaffold (common/jax/)
# and the baseline harnesses (baselines/). Only PyPI-resolvable frameworks are
# declared here; TensorNEAT is GitHub-only (not on PyPI) so it is installed
# manually — see baselines/tensorneat/run_baseline.py.
[project.optional-dependencies]
jax = ["jax>=0.4"]                   # common/jax scaffold (add [cuda12] for GPU)
snn = ["norse>=1.0"]                 # baselines/snn (snntorch already in base)
nengo = ["nengo>=3.2"]               # baselines/nengo: NEF / neuromorphic
evosax = ["evosax>=0.1", "jax>=0.4"] # baselines/evosax: JAX evolution strategies

# The suite is driven by orchestrator.py / setup.py; there is no importable
# package.
[tool.setuptools]
py-modules = []

# This suite is Linux-only (CUDA, /proc RSS polling, mmap-backed allocators), so
# constrain uv's resolution to Linux. Without this, uv also solves for win32/mac
# and fails on packages (jax/jaxlib, tensorneat) that don't ship wheels there.
[tool.uv]
environments = ["sys_platform == 'linux'"]
